<mat-menu #appMenu="matMenu" xPosition="before" panelClass="app-menu-panel">
  <!-- Welcome header as disabled menu item -->
  <button mat-menu-item class="menu-header" *ngIf="isConnected">
    <span>
      {{ 'menu.greeting' | translate : { username: username } }}
    </span>
  </button>

  <mat-divider *ngIf="isConnected"></mat-divider>

  <!-- Navigation Group -->
  <!-- Dashboard button -->
  <button
    mat-menu-item
    *ngIf="showDashboardButton"
    (click)="sendDashboardEvent()">
    <mat-icon>dashboard</mat-icon>
    <span>{{ 'menu.dashboard' | translate }}</span>
  </button>

  <!-- Change app/territory button -->
  <button
    mat-menu-item
    *ngIf="showChangeAppButton"
    (click)="sendChangeAppEvent()">
    <mat-icon>swap_horiz</mat-icon>
    <span>{{ 'menu.changeAppOrTerritory' | translate }}</span>
  </button>

  <mat-divider
    *ngIf="showDashboardButton || showChangeAppButton"></mat-divider>

  <!-- System Info Group -->
  <!-- About button -->
  <button mat-menu-item (click)="openAboutDialog()">
    <mat-icon>info</mat-icon>
    <span>{{ 'systemInfo.about' | translate }}</span>
  </button>

  <!-- Recent Errors button (only in non-production) -->
  <button
    mat-menu-item
    *ngIf="!environment.production"
    (click)="openErrorSidebar()">
    <mat-icon>bug_report</mat-icon>
    <span>{{ 'systemInfo.recentErrors' | translate }}</span>
    <span class="badge" *ngIf="unreviewedErrorCount > 0">
      {{ unreviewedErrorCount }}
    </span>
  </button>

  <mat-divider
    *ngIf="
      (!isConnected && showLoginButton) ||
      (isConnected && (showProfileButton || showLogoutButton))
    "></mat-divider>

  <!-- Account Group -->
  <button
    mat-menu-item
    *ngIf="!isConnected && showLoginButton"
    (click)="sendLoginEvent()">
    <mat-icon>login</mat-icon>
    <span>{{ 'menu.login' | translate }}</span>
  </button>

  <button
    mat-menu-item
    *ngIf="isConnected && showProfileButton"
    (click)="sendProfileEvent()">
    <mat-icon>person</mat-icon>
    <span>{{ 'profile.myAccount' | translate }}</span>
  </button>

  <button
    mat-menu-item
    *ngIf="isConnected && showLogoutButton"
    (click)="sendLogoutEvent()">
    <mat-icon>logout</mat-icon>
    <span>{{ 'loginPage.logoutText' | translate }}</span>
  </button>
</mat-menu>
