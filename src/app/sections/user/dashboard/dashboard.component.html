<div class="dashboard-container">
  <h1>{{ 'dashboardPage.applicationsTitle' | translate }}</h1>

  <p *ngIf="loading" class="dashboard-status" role="status">
    {{ 'dashboardPage.loading' | translate }}
  </p>
  <p *ngIf="loadError && !loading" class="dashboard-status dashboard-status--error" role="alert">
    {{ 'dashboardPage.loadError' | translate }}
  </p>

  <div id="research" *ngIf="!loadError && (allItems.length > 0 || searchKeyword.length >= 2)">
    <app-dashboard-searchbox
      (keywords)="onKeywordsSearch($event)" />
  </div>

  <p
    *ngIf="!loadError && searchKeyword.length >= 2 && items.length === 0 && !loadingMore"
    class="dashboard-status"
    role="status">
    {{ 'dashboardPage.noSearchResults' | translate }}
  </p>

  <app-dashboard-items
    *ngIf="!loading && !loadError"
    [items]="items"
    [hasMorePages]="hasMorePages"
    [loadingMore]="loadingMore"
    [loading]="loading"
    (loadMore)="loadMoreItems()" />
</div>
