<div class="dashboard-container">
  <h1>{{ 'dashboardPage.applicationsTitle' | translate }}</h1>

  <p *ngIf="loading" class="page-status" role="status">
    {{ 'dashboardPage.loading' | translate }}
  </p>
  <p *ngIf="loadError && !loading" class="page-status page-status--error" role="alert">
    {{ 'dashboardPage.loadError' | translate }}
  </p>

  <div id="research" *ngIf="!loading && !loadError && allItems.length > 0">
    <app-dashboard-searchbox
      (keywords)="onKeywordsSearch($event)" />
  </div>

  <p
    *ngIf="!loading && !loadError && allItems.length > 0 && items.length === 0"
    class="page-status"
    role="status">
    {{ 'dashboardPage.noSearchResults' | translate }}
  </p>

  <app-dashboard-items
    *ngIf="!loading && !loadError"
    [items]="items"
    [hasMorePages]="hasMorePages"
    [loadingMore]="loadingMore"
    (loadMore)="loadMoreItems()" />
</div>
