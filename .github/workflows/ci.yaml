name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
      - run: npm set //npm.pkg.github.com/:_authToken ${{ secrets.TOKEN_FOR_WORKFLOWS }}
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build -- --configuration=production --base-href=/sitmun-viewer-app/
        env:
          NODE_OPTIONS: "--openssl-legacy-provider --max-old-space-size=8192"
      - name: Validate build artifacts
        run: test -d dist/viewer-app && test -n "$(ls -A dist/viewer-app)"
